# Data configuration
data:
  # LibriSpeech dataset configuration
  librispeech:
    train_root: "/mnt/data/Librispeech/train/train-all-960"       # Training data path
    val_root: "/mnt/data/Librispeech/dev/dev-all"                 # Validation data path
    s3_token_dir: "speech_tokens"                                 # Location where preprocessed S3 acoustic tokens are stored

  # AudioSet dataset configuration
  audioset:
    train_root: "/mnt/data/AudioSet/data/audio/unbal_train"       # Training data path
    val_root: "/mnt/data/AudioSet/data/audio/eval"                # Validation data path
    file_dir: "/mnt/data/AudioSet/data"                           # Location of AudioSet configuration files
    desc_path: "/mnt/data/AudioSet/audioset_description.jsonl"    # AudioSet description file

  num_workers: 2                    # Number of processes per GPU allocated for data loading
  pin_memory: true                  # Whether to share memory between processes

# Path configuration
paths:
  # Speaker encoder checkpoint path
  speaker_encoder_checkpoint: "speechbrain/spkrec-ecapa-voxceleb"
  # BEATs Feature Extractor model used to extract timbre embedding vectors
  beats_feature_extractor_checkpoint: "pretrained_models/BEATs_iter3_plus_AS2M.pt"
  # Checkpoint save directory
  checkpoint_dir: "checkpoints"
  # Visualization output directory
  output_dir: "outputs_cfm"

# Dataset audio configuration
audio:
  sample_rate: 16000  # Sample rate
  max_length: 160000  # Maximum audio length

# Hyperparameter configuration
hyperparameters:
  ast: # AudioSet token self-supervised training stage
    input_dim: 768              # BEATs feature dimension
    hidden_dim: 1024            # Hidden layer dimension
    vocab_size: 4096            # Vocabulary size
    num_epochs: 3               # Number of training epochs
    losses:
      reconstruction_loss_weight: 1.0   # Weight of the reconstruction loss
      commit_loss_weight: 10.0          # Weight of the VQ commitment loss
    optimizer:
      weight_decay: 0.01          # Weight decay coefficient
      betas: [ 0.9, 0.999 ]       # Beta parameters of the AdamW optimizer
      scheduler:
        max_lr: 0.0001            # Maximum learning rate of the OneCycleLR scheduler
        pct_start: 0.1            # Percentage of total steps spent reaching the maximum learning rate
        div_factor: 10.0          # Initial learning rate = max_lr / div_factor
        final_div_factor: 100.0   # Final learning rate = max_lr / (div_factor * final_div_factor)

  llm:
    model_name: "Qwen/Qwen3-0.6B-Base"        # Name of the pretrained base model
    s3_vocab_size: 4096                       # S3 semantic codebook size
    as_vocab_size: 4096                       # Audio discrete code (AudioSet/AST) vocabulary size
    max_sequence_length: 8192                 # Maximum context length (prompt + style placeholders + target tokens)
    gradient_checkpointing: true              # Enable gradient checkpointing to save memory
    num_epochs: 3                             # Number of training epochs

    # ====== Style prefix (reference audio embedding projection) ======
    style_num_tokens: 16                      # Number of [AUDIO_i] placeholders used in the prompt (K); a larger K captures style more finely
    style_strength: 0.5                       # Style injection strength α∈[0,1]; 0=pure text, 1=full style
    style_dropout_p: 0.7                      # During training, set α to 0 with this probability (CFG no-style branch) to improve text controllability

    # ====== coarse → fine auxiliary head (only affects the training loss, does not change the inference interface) ======
    coarse_num_clusters: 128                  # Number of coarse clusters C into which the 4096 codewords are grouped; commonly 64/128/256
    coarse_loss_weight: 0.5                   # Auxiliary loss weight λ; total loss = LM + λ*coarse, recommended 0.2~0.6
    coarse_code_to_cluster_path: null         # JSON path for codeword→cluster ID; uses uniform bucketing when null

    optimizer:
      weight_decay: 0.1                       # AdamW weight decay; suppresses overfitting, commonly 0.01~0.1
      betas: [ 0.9, 0.999 ]                   # AdamW momentum parameters β1/β2; defaults are stable
      scheduler:
        max_lr: 0.00005                       # Peak learning rate; for 0.6B, start from 5e-5 and fine-tune based on batch/memory
        pct_start: 0.1                        # Warmup ratio; reach the maximum learning rate within the first 10% of steps
        div_factor: 10.0                      # Initial learning rate ratio: lr_start = max_lr / div_factor
        final_div_factor: 100.0               # Final learning rate ratio: lr_final = max_lr / (div_factor * final_div_factor)

  flow: # Flow Matching model training stage
    loss_weights:
      teacher_speech: 0.5         # LibriSpeech→Whisper distillation weight
      teacher_audio: 1.0          # AudioSet→BEATs distillation weight
    enable_whitebox_probe: true   # Whether to enable the white-box probe
    s3_vocab_size: 4096           # S3 semantic token vocabulary size
    as_vocab_size: 4096           # AudioSet vocabulary size
    token_embedding_dim: 1024     # Embedding dimension of S3/AudioSet tokens
    mel_mean: -5.8843             # Global mean of the mel-spectrogram (used for normalization)
    mel_std: 2.2615               # Global standard deviation of the mel-spectrogram (used for normalization)
    hidden_dim: 1024              # DiT hidden layer dimension
    n_heads: 16                   # Number of attention heads
    n_layers: 24                  # Number of DiT layers
    ff_mult: 4                    # Feed-forward network scaling factor
    dropout: 0.2                  # Dropout probability
    drop_ref_prob: 0.1            # Drop the reference mel for 10% of training samples
    sigma: 0.5                    # Noise scale coefficient (controls noise strength)
    cond_drop_prob: 0.1           # Proportion of unconditional samples for CFG
    n_timesteps: 32               # Number of inference timesteps
    cfg_scale: 3.0                # CFG weight at inference
    sway_coef: -1.0               # Sway sampling coefficient at inference
    num_epochs: 3                 # Total number of training epochs
    optimizer:
      weight_decay: 0.1           # Weight decay coefficient
      betas: [ 0.9, 0.999 ]       # Beta parameters of the AdamW optimizer
      scheduler:
        max_lr: 0.0001            # Maximum learning rate of the OneCycleLR scheduler
        pct_start: 0.1            # Percentage of total steps spent reaching the maximum learning rate
        div_factor: 10.0          # Initial learning rate = max_lr / div_factor
        final_div_factor: 100.0   # Final learning rate = max_lr / final_div_factor

# Vocoder configuration
vocos:
  # Output sample rate configuration
  sample_rate: 24000   # Sample rate required by the Vocos model
  # Resampling parameters
  resample:
    method: "sinc_interp_kaiser"   # Resampling method (e.g., sinc interpolation with a Kaiser window)
    lowpass_filter_width: 6        # Low-pass filter width, used during resampling
    rolloff: 0.99                  # Rolloff coefficient, controls the steepness of the resampling filter transition band
  # Mel-spectrogram parameters
  mel:
    n_fft: 1024         # Window size of the Fast Fourier Transform (FFT)
    hop_length: 256     # Hop length, the number of samples between adjacent frames
    win_length: 1024    # Window length, the size of the analysis window for STFT (Short-Time Fourier Transform)
    n_mels: 100         # Number of mel filterbanks, determines the dimension of the mel-spectrogram
    f_min: 0.0          # Minimum frequency of the mel filterbanks
    f_max: 12000        # Maximum frequency of the mel filterbanks
    center: true        # Whether to align the window center with the frame center
    power: 1.0          # Exponent of the power spectrum (1.0 for magnitude spectrum, 2.0 for power spectrum)

# Logging configuration
logging:
  wandb:
    project: "REPA_single"  # wandb project name
    name: "world-voice"  # Experiment name
    enabled: false  # Whether to enable wandb
  console:
    level: "INFO"  # Logging level
    format: "%(asctime)s [%(levelname)s] %(message)s"  # Log format
    to_file: false  # Whether to output to a file
